<link rel="icon" type="image/png" href="assets/meta/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/meta/apple-touch-icon.png">

<meta property="og:description" content="Restaurant & Cocktails, Valencia. Abrimos pronto.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=58">
<style>
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--black);
  }

  .teaser-page {
    position: relative;
    width: 100vw;
    height: 100dvh;
    color: var(--cream);
    overflow: hidden;
    background: var(--black);
  }

  /* Imagen real (no CSS background) para que el zoom con transform:scale
     nunca deje franjas negras, sea cual sea la proporción de pantalla —
     con background-size esto dependía de qué eje fuera el limitante. */
  .teaser-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: scale(1.1);
  }

  /* Oscurece la foto de fondo lo justo para que el texto/letras crema
     se sigan leyendo encima, sin taparla del todo. */
  .teaser-page::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.25) 65%, rgba(0,0,0,0.75) 100%);
  }

  /* Cabecera centrada: logo + leyenda, uno encima del otro. */
  .teaser-top {
    position: absolute;
    top: 2.25rem;
    left: 0;
    right: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  /* Logo + leyenda como una sola imagen (tipografía exacta pedida por
     el usuario), no logo + texto por separado. */
  .teaser-top .lockup {
    width: clamp(220px, 32vw, 380px);
    height: auto;
    display: block;
  }

  .teaser-contact {
    position: absolute;
    top: 1.75rem;
    right: 1.5rem;
    z-index: 4;
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }
  .teaser-contact a {
    color: var(--cream);
    opacity: 0.85;
    transition: opacity 0.15s ease;
    line-height: 0;
  }
  .teaser-contact a:hover { opacity: 1; }
  .teaser-contact svg { width: 20px; height: 20px; }
  /* El sobre ocupa menos alto que su viewBox que el círculo de
     Instagram (15/24 vs 18/24), así que a igual tamaño de caja se ve
     más bajo — se agranda su caja proporcionalmente para que la
     altura visible de ambos iconos quede igual. */
  .teaser-contact .icon-mail svg { width: 24px; height: 24px; }

  @media (max-width: 640px) {
    .teaser-contact { top: 1.5rem; right: 1.25rem; gap: 0.5rem; }
    .teaser-contact svg { width: 18px; height: 18px; }
    .teaser-contact .icon-mail svg { width: 21.6px; height: 21.6px; }
  }

  /* Franja inferior: pie compacto (idioma/legal) encima de las dos
     llamadas a la acción a toda anchura. */
  .teaser-bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .teaser-footer {
    margin-top: 0.6rem;
    margin-bottom: 1rem;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
  }
  .teaser-footer a {
    color: rgba(236, 231, 221, 0.55);
    text-decoration: none;
  }
  .teaser-footer a:hover { text-decoration: underline; }
  .teaser-footer .lang-switch { display: flex; justify-content: center; margin-bottom: 0.4rem; }

  .teaser-cta-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 1rem 0.5rem;
  }

  .teaser-cta {
    display: block;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color: var(--cream);
    text-decoration: none;
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: -0.01em;
    line-height: 0.85;
    font-size: clamp(1.5rem, 6vw, 3.4rem);
    transition: opacity 0.15s ease;
  }

  /* La etiqueta de Reservas es una imagen (tipografía exacta pedida),
     no texto — se escala por altura en vez de font-size. */
  .teaser-cta-img img {
    display: block;
    height: clamp(1.5rem, 6vw, 3rem);
    width: auto;
  }
  .teaser-cta:hover { opacity: 0.85; }

  /* "Bookings" en inglés usa la fuente Helvetica Neue real (pasada
     por el usuario) como texto vivo, en vez de una imagen — mismo
     tamaño visual que la etiqueta de Reservas/Newsletter. */
  html:not([lang="en"]) .lang-en-only { display: none; }
  html[lang="en"] .lang-es-only { display: none; }
  .teaser-cta-text {
    display: block;
    font-family: "Helvetica Neue Web", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(1.8rem, 7.2vw, 3.6rem);
    line-height: 0.85;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--cream);
  }

  /* El botón de newsletter abre su formulario hacia arriba, justo
     encima de la propia palabra — sin mover el resto del layout. */
  .newsletter-widget {
    position: relative;
    top: auto;
    left: auto;
    right: auto;
    bottom: auto;
    transform: none;
    background: none;
    box-shadow: none;
    border-radius: 0;
    padding: 0;
    width: auto;
  }
  .newsletter-widget:not(.is-collapsed) .newsletter-toggle { opacity: 0; pointer-events: none; }

  /* Grande y centrado, casi a pantalla completa — no un desplegable
     pequeño junto al botón. */
  .newsletter-widget .newsletter-body {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    width: min(94vw, 780px);
    max-height: 88vh;
    overflow-y: auto;
    background: var(--black);
    color: var(--cream);
    border-radius: 2px;
    padding: clamp(2rem, 6vw, 4rem);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    z-index: 500;
  }
  .newsletter-widget.is-collapsed .newsletter-body { display: none; }

  .newsletter-body .newsletter-title {
    font-family: var(--display);
    font-size: clamp(2rem, 6vw, 3.4rem);
    letter-spacing: 0;
    margin-bottom: 1rem;
  }
  .newsletter-body .newsletter-text {
    font-size: clamp(1rem, 2vw, 1.3rem);
    color: var(--cream);
    opacity: 0.75;
    margin-bottom: 2rem;
  }
  .newsletter-body .newsletter-form { flex-direction: column; gap: 1rem; }
  .newsletter-body .newsletter-input {
    padding: 1.1rem 1.3rem;
    font-size: clamp(1rem, 2vw, 1.2rem);
    border-radius: 2px;
  }
  .newsletter-body .newsletter-submit {
    padding: 1.1rem 1.3rem;
    font-size: clamp(1rem, 2vw, 1.2rem);
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .newsletter-body .newsletter-close {
    top: 1.25rem;
    right: 1.5rem;
    font-size: 2.2rem;
  }

  @media (max-width: 640px) {
    /* A este ancho, "Reservas" y "Newsletter" no caben lado a lado —
       se apilan en vertical. Misma altura para las dos (igual que en
       la imagen de referencia), cada una con su ancho natural — así
       "Newsletter" (más letras) llega casi al borde y "Reservas"
       queda proporcionalmente más corta, sin verse desigual. */
    .teaser-cta-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.3rem;
      padding: 0 1rem 0.75rem;
    }
    .teaser-cta { font-size: clamp(2.1rem, 12.5vw, 3rem); }
    .teaser-cta-img img { height: clamp(2.4rem, 11.5vw, 3.2rem); width: auto; }
    .teaser-cta-text { font-size: clamp(2.5rem, 14.5vw, 3.9rem); }
    /* Foto propia para móvil (1080x1920, ya compuesta para vertical) y
       sin el zoom de escritorio. */
    .teaser-bg { transform: none; }
  }

  /* Centrado en toda la pantalla, como un aviso modal, en vez de
     pegado a una esquina o lateral. */
  .cookie-banner {
    top: 50%;
    left: 50%;
    right: auto;
    bottom: auto;
    transform: translate(-50%, -50%);
    max-width: 320px;
    flex-direction: column;
    align-items: stretch;
    gap: 0.85rem;
    z-index: 600;
  }
  .cookie-banner .cookie-text { flex: 0 1 auto; }
  .cookie-actions { justify-content: flex-end; }

  @media (max-width: 640px) {
    .cookie-banner { max-width: min(320px, calc(100vw - 2.5rem)); }
  }
</style>
</head>
<body>

<div class="teaser-page">
  <picture>
    <source media="(max-width: 640px)" srcset="assets/teaser/bg-mobile.jpg?v=2">
    <img class="teaser-bg" src="assets/teaser/bg-desktop.jpg?v=3" alt="">
  </picture>

  <div class="teaser-top">
    <img class="lockup" src="assets/logo/roce-lockup-cream.png" alt="ROCE — Restaurant &amp; Cocktails, Marqués del Turia 16, Valencia (Spain)">
  </div>

  <div class="teaser-contact">
    <a href="https://www.instagram.com/somosroce" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg>
    </a>
    <a href="mailto:reservas@roce.es" aria-label="Email" class="icon-mail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="1.5"/><path d="M3 6l9 7 9-7"/></svg>
    </a>
  </div>

  <div class="teaser-bottom">
    <div class="teaser-cta-row">
      <a class="teaser-cta teaser-cta-img" href="fuck-u" aria-label="Reservas">
        <img class="lang-es-only" src="assets/logo/label-reservas.png" alt="Reservas">
        <span class="teaser-cta-text lang-en-only">Bookings</span>
      </a>

      <div class="newsletter-widget is-collapsed" id="newsletterWidget">
        <button class="teaser-cta teaser-cta-img newsletter-toggle" id="newsletterToggle" aria-label="Newsletter">
          <img src="assets/logo/label-newsletter.png" alt="Newsletter">
        </button>
        <div class="newsletter-body" id="newsletterBody">
          <button class="newsletter-close" id="newsletterClose" aria-label="Cerrar">&times;</button>
          <p class="newsletter-title">Newsletter</p>
          <p class="newsletter-text" data-i18n="newsletter_text">Entérate antes que nadie de todo.</p>
          <form class="newsletter-form" id="newsletterForm">
            <input type="hidden" name="access_key" value="6e0e35fc-6443-4455-adc7-3999eabf6abc">
            <input type="hidden" name="subject" value="Nueva suscripción — Newsletter ROCE">
            <input type="hidden" name="from_name" value="Newsletter ROCE">
            <input type="email" name="email" class="newsletter-input" placeholder="tu@email.com" data-i18n-placeholder="newsletter_placeholder" required>
            <button type="submit" class="newsletter-submit" data-i18n="newsletter_submit">Enviar</button>
          </form>
        </div>
      </div>
    </div>

    <div class="teaser-footer">
      <div class="lang-switch">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a href="privacidad.html" data-i18n="footer_privacy">Política de privacidad</a> · <a href="cookies.html" data-i18n="footer_cookies">Política de cookies</a>
    </div>
  </div>
</div>

<div class="cookie-banner" id="cookieBanner">
  <p class="cookie-text"><span data-i18n="cookie_text">Usamos una cookie técnica para recordar tu elección. Sin analítica ni publicidad.</span> <a href="cookies.html" data-i18n="cookie_more_info">Más información</a>.</p>
  <div class="cookie-actions">
    <button class="cookie-reject" id="cookieReject" data-i18n="cookie_reject">Rechazar</button>
    <button class="cookie-accept" id="cookieAccept" data-i18n="cookie_accept">Aceptar</button>
  </div>
</div>
<script src="cookies.js?v=1"></script>
<script src="i18n.js?v=2"></script>

<script>
  function initNewsletterWidget() {
    const widget = document.getElementById('newsletterWidget');
    const toggleBtn = document.getElementById('newsletterToggle');
    const closeBtn = document.getElementById('newsletterClose');
    const form = document.getElementById('newsletterForm');
    const body = document.getElementById('newsletterBody');
    if (!widget || !toggleBtn || !closeBtn || !form || !body) return;

    toggleBtn.addEventListener('click', () => {
      widget.classList.remove('is-collapsed');
    });

    closeBtn.addEventListener('click', () => {
      widget.classList.add('is-collapsed');
    });

    document.addEventListener('click', (e) => {
      if (!widget.contains(e.target)) widget.classList.add('is-collapsed');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('.newsletter-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = '...';

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'Error desconocido');
        body.innerHTML = `<p class="newsletter-thanks">${window.ROCE_I18N.t('newsletter_thanks')}</p>`;
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = window.ROCE_I18N.t('newsletter_submit');
        const existing = body.querySelector('.newsletter-error');
        if (existing) existing.remove();
        body.querySelector('.newsletter-text').insertAdjacentHTML(
          'afterend',
          `<p class="newsletter-error">${window.ROCE_I18N.t('newsletter_error')}</p>`
        );
      }
    });
  }

  initNewsletterWidget();
</script>

</body>
