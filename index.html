<style>
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--black);
  }

  .teaser-page {
    position: relative;
    width: 100vw;
    height: 100dvh;
    color: var(--cream);
    overflow: hidden;
    background: var(--black);
  }

  /* Imagen real (no CSS background) para que el zoom con transform:scale
     nunca deje franjas negras, sea cual sea la proporción de pantalla —
     con background-size esto dependía de qué eje fuera el limitante. */
  .teaser-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: scale(1.1);
  }

  /* Oscurece la foto de fondo lo justo para que el texto/letras crema
     se sigan leyendo encima, sin taparla del todo. */
  .teaser-page::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.25) 65%, rgba(0,0,0,0.75) 100%);
  }

  /* Cabecera centrada: logo + leyenda, uno encima del otro. */
  .teaser-top {
    position: absolute;
    top: 2.25rem;
    left: 0;
    right: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  /* Logo + leyenda como una sola imagen (tipografía exacta pedida por
     el usuario), no logo + texto por separado. */
  .teaser-top .lockup {
    width: clamp(220px, 32vw, 380px);
    height: auto;
    display: block;
  }

  /* Franja inferior: pie compacto (idioma/legal) encima de las dos
     llamadas a la acción a toda anchura. */
  .teaser-bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .teaser-footer {
    margin-top: 0.6rem;
    margin-bottom: 1rem;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
  }
  .teaser-footer a {
    color: rgba(236, 231, 221, 0.55);
    text-decoration: none;
  }
  .teaser-footer a:hover { text-decoration: underline; }
  .teaser-footer .lang-switch { display: flex; justify-content: center; margin-bottom: 0.4rem; }

  .teaser-cta-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 1rem 0.5rem;
  }

  .teaser-cta {
    display: block;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color: var(--cream);
    text-decoration: none;
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: -0.01em;
    line-height: 0.85;
    font-size: clamp(1.5rem, 6vw, 3.4rem);
    transition: opacity 0.15s ease;
  }

  /* La etiqueta de Reservas es una imagen (tipografía exacta pedida),
     no texto — se escala por altura en vez de font-size. */
  .teaser-cta-img img {
    display: block;
    height: clamp(1.5rem, 6vw, 3rem);
    width: auto;
  }
  .teaser-cta:hover { opacity: 0.85; }

  /* "Bookings" en inglés usa la fuente Helvetica Neue real (pasada
     por el usuario) como texto vivo, en vez de una imagen — mismo
     tamaño visual que la etiqueta de Reservas/Newsletter. */
  html:not([lang="en"]) .lang-en-only { display: none; }
  html[lang="en"] .lang-es-only { display: none; }
  .teaser-cta-text {
    display: block;
    font-family: "Helvetica Neue Web", "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(1.8rem, 7.2vw, 3.6rem);
    line-height: 0.85;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--cream);
  }

  /* El botón de newsletter abre su formulario hacia arriba, justo
     encima de la propia palabra — sin mover el resto del layout. */
  .newsletter-widget {
    position: relative;
    top: auto;
    left: auto;
    right: auto;
    bottom: auto;
    transform: none;
    background: none;
    box-shadow: none;
    border-radius: 0;
    padding: 0;
    width: auto;
  }
  .newsletter-widget:not(.is-collapsed) .newsletter-toggle { opacity: 0; pointer-events: none; }
  .newsletter-toggle { position: relative; }
  .newsletter-toggle.is-subscribed { opacity: 0.6; cursor: default; }
  .newsletter-strike {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .newsletter-strike path {
    fill: none;
    stroke: #c0392b;
    stroke-width: 10;
    stroke-linecap: round;
  }
  .newsletter-toggle.is-subscribed .newsletter-strike { display: block; }

  /* El formulario aparece dentro de un plato real (foto pasada por
     el usuario) en vez de una caja — el contenido queda encajado en
     el hueco central plano del plato, como si estuviera grabado ahí. */
  .newsletter-widget .newsletter-body {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    width: min(92vw, 560px);
    aspect-ratio: 1 / 1;
    background: url("assets/logo/newsletter-plate.png") center / contain no-repeat;
    padding: 0;
    box-shadow: none;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
  }
  .newsletter-widget.is-collapsed .newsletter-body { display: none; }
  /* Al pedir confirmación de cierre, el plato pasa a la versión rota
     — el pequeño chantaje visual de marca antes de dejar ir al
     suscriptor. */
  .newsletter-widget .newsletter-body.is-broken {
    background-image: url("assets/logo/newsletter-plate-broken.png");
  }
  .newsletter-body.is-broken .newsletter-close { display: none; }

  .newsletter-plate-content,
  .newsletter-confirm-close {
    width: 42%;
    text-align: center;
    color: var(--black);
  }

  .newsletter-body .newsletter-title {
    font-family: var(--display);
    font-size: clamp(0.85rem, 2.1vw, 1.15rem);
    letter-spacing: 0;
    margin-bottom: 0.35rem;
  }
  .newsletter-body .newsletter-text,
  .newsletter-body .newsletter-thanks {
    font-size: clamp(0.55rem, 1.3vw, 0.75rem);
    color: rgba(10, 10, 10, 0.7);
    margin-bottom: 0.6rem;
    line-height: 1.35;
  }
  .newsletter-body .newsletter-form { flex-direction: column; gap: 0.45rem; }
  .newsletter-body .newsletter-input {
    padding: 0.5rem 0.6rem;
    font-size: clamp(0.55rem, 1.3vw, 0.75rem);
    border-radius: 2px;
    background: rgba(10, 10, 10, 0.05);
    border: 1px solid rgba(10, 10, 10, 0.25);
    color: var(--black);
  }
  .newsletter-body .newsletter-input::placeholder { color: rgba(10, 10, 10, 0.4); }
  .newsletter-body .newsletter-submit {
    padding: 0.5rem 0.7rem;
    font-size: clamp(0.55rem, 1.3vw, 0.75rem);
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    background: var(--black);
    color: var(--white);
  }
  .newsletter-body .newsletter-close {
    top: 0.75rem;
    right: 2.25rem;
    width: 1.9rem;
    height: 1.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 10, 0.75);
    border-radius: 50%;
    color: var(--white);
    opacity: 1;
    font-size: 1.2rem;
  }
  .newsletter-body .newsletter-close:hover { background: rgba(10, 10, 10, 0.9); }

  @media (max-width: 640px) {
    .newsletter-body .newsletter-close { right: 1.5rem; }
  }

  .newsletter-confirm-text {
    font-size: clamp(0.6rem, 1.4vw, 0.8rem);
    line-height: 1.35;
    margin-bottom: 0.7rem;
  }
  .newsletter-confirm-actions { display: flex; flex-direction: column; gap: 0.4rem; }
  .newsletter-confirm-actions button {
    border: none;
    border-radius: 2px;
    padding: 0.45rem 0.6rem;
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: clamp(0.5rem, 1.1vw, 0.65rem);
    cursor: pointer;
  }
  #newsletterConfirmStay { background: var(--black); color: var(--white); }
  #newsletterConfirmYes {
    background: none;
    color: rgba(10, 10, 10, 0.55);
    text-decoration: underline;
  }

  @media (max-width: 640px) {
    .newsletter-widget .newsletter-body { width: min(92vw, 400px); }
  }

  @media (max-width: 640px) {
    /* A este ancho, "Reservas" y "Newsletter" no caben lado a lado —
       se apilan en vertical. Misma altura para las dos (igual que en
       la imagen de referencia), cada una con su ancho natural — así
       "Newsletter" (más letras) llega casi al borde y "Reservas"
       queda proporcionalmente más corta, sin verse desigual. */
    .teaser-cta-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.3rem;
      padding: 0 1rem 0.75rem;
    }
    .teaser-cta { font-size: clamp(2.1rem, 12.5vw, 3rem); }
    .teaser-cta-img img { height: clamp(2.4rem, 11.5vw, 3.2rem); width: auto; }
    .teaser-cta-text { font-size: clamp(2.5rem, 14.5vw, 3.9rem); }
    /* Foto propia para móvil (1080x1920, ya compuesta para vertical) y
       sin el zoom de escritorio. */
    .teaser-bg { transform: none; }
  }

</style>

<script>
  function initNewsletterWidget() {
    const widget = document.getElementById('newsletterWidget');
    const toggleBtn = document.getElementById('newsletterToggle');
    const closeBtn = document.getElementById('newsletterClose');
    const form = document.getElementById('newsletterForm');
    const body = document.getElementById('newsletterBody');
    const plateContent = document.getElementById('newsletterPlateContent');
    const confirmClose = document.getElementById('newsletterConfirmClose');
    const confirmStayBtn = document.getElementById('newsletterConfirmStay');
    const confirmYesBtn = document.getElementById('newsletterConfirmYes');
    const emailInput = form ? form.querySelector('.newsletter-input') : null;
    if (!widget || !toggleBtn || !closeBtn || !form || !body) return;

    // Si ya se ha suscrito antes (en esta visita o en una anterior), no
    // tiene sentido volver a abrirle el formulario ni hacerle pasar por
    // el "¿seguro que quieres abandonar?" para cerrarlo — se deja el
    // botón inhabilitado directamente.
    const SUBSCRIBED_KEY = 'roce_newsletter_subscribed';
    if (localStorage.getItem(SUBSCRIBED_KEY)) {
      toggleBtn.disabled = true;
      toggleBtn.classList.add('is-subscribed');
    }

    // El input de email es pequeño a propósito (para que quepa en el
    // plato) y eso hace que iOS haga zoom al enfocarlo — es lo que se
    // quiere, para que se vea bien lo que escribes. El problema era que
    // ese zoom se quedaba puesto después. Forzamos que se quite al
    // cerrar el teclado (blur) o al enviar, subiendo un momento
    // maximum-scale y devolviéndolo enseguida a su valor original.
    function resetZoom() {
      const viewport = document.querySelector('meta[name="viewport"]');
      if (!viewport) return;
      const original = viewport.getAttribute('content');
      viewport.setAttribute('content', original + ', maximum-scale=1.0');
      setTimeout(() => viewport.setAttribute('content', original), 300);
    }
    if (emailInput) emailInput.addEventListener('blur', resetZoom);

    toggleBtn.addEventListener('click', () => {
      widget.classList.remove('is-collapsed');
      // Por si se dejó a medio cerrar la última vez, vuelve a arrancar
      // mostrando el formulario, no la pregunta de confirmación.
      if (plateContent && confirmClose) {
        plateContent.hidden = false;
        confirmClose.hidden = true;
        body.classList.remove('is-broken');
      }
      closeBtn.style.display = '';
    });

    // En vez de cerrar directamente, la X pregunta primero — un
    // pequeño empujón de humor de marca antes de dejar escapar al
    // suscriptor. El plato pasa a la versión rota para reforzar el
    // dramatismo de la pregunta.
    closeBtn.addEventListener('click', () => {
      if (plateContent && confirmClose) {
        plateContent.hidden = true;
        confirmClose.hidden = false;
        body.classList.add('is-broken');
      } else {
        widget.classList.add('is-collapsed');
      }
    });

    if (confirmStayBtn && confirmClose && plateContent) {
      confirmStayBtn.addEventListener('click', () => {
        confirmClose.hidden = true;
        plateContent.hidden = false;
        body.classList.remove('is-broken');
      });
    }

    if (confirmYesBtn) {
      confirmYesBtn.addEventListener('click', () => {
        widget.classList.add('is-collapsed');
      });
    }

    document.addEventListener('click', (e) => {
      if (!widget.contains(e.target)) widget.classList.add('is-collapsed');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (emailInput) emailInput.blur();
      resetZoom();
      const submitBtn = form.querySelector('.newsletter-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = '...';

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'Error desconocido');
        plateContent.innerHTML = `<p class="newsletter-thanks">${window.ROCE_I18N.t('newsletter_thanks')}</p>`;
        localStorage.setItem(SUBSCRIBED_KEY, '1');
        toggleBtn.disabled = true;
        toggleBtn.classList.add('is-subscribed');
        // Ya se ha suscrito, no tiene sentido preguntarle si quiere
        // irse (ni mostrarle el plato roto) — se cierra solo, así que
        // la X tampoco pinta nada aquí.
        closeBtn.style.display = 'none';
        setTimeout(() => widget.classList.add('is-collapsed'), 2000);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = window.ROCE_I18N.t('newsletter_submit');
        const existing = plateContent.querySelector('.newsletter-error');
        if (existing) existing.remove();
        plateContent.querySelector('.newsletter-text').insertAdjacentHTML(
          'afterend',
          `<p class="newsletter-error">${window.ROCE_I18N.t('newsletter_error')}</p>`
        );
      }
    });
  }

  initNewsletterWidget();
</script>
