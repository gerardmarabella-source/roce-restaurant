<style>
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--black);
  }

  .teaser-page {
    position: relative;
    width: 100vw;
    height: 100dvh;
    background: var(--black);
    color: var(--cream);
    overflow: hidden;
  }

  /* Esquina superior izquierda: eyebrow con efecto "doble exposición",
     igual que ART DINING CLUB en la referencia. */
  .teaser-eyebrow {
    position: absolute;
    top: 1.75rem;
    left: 1.75rem;
    z-index: 4;
    font-family: var(--display);
    font-size: clamp(0.7rem, 1.6vw, 0.9rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1.3;
  }
  .teaser-eyebrow span { display: block; }
  .teaser-eyebrow span:last-child {
    margin-top: -1.3em;
    transform: translate(3px, 3px);
    opacity: 0.35;
  }

  .teaser-reserve-btn {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    z-index: 4;
    background: var(--cream);
    color: var(--black);
    text-decoration: none;
    font-family: var(--display);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.85rem 1.6rem;
    border-radius: 2px;
    transition: transform 0.15s ease;
  }
  .teaser-reserve-btn:hover { transform: translateY(-2px); }

  .teaser-vertical-mark {
    position: absolute;
    top: 50%;
    right: 1.5rem;
    z-index: 4;
    transform: translateY(-50%);
    height: clamp(150px, 24vh, 260px);
    width: auto;
    opacity: 0.95;
  }

  .teaser-caption {
    position: absolute;
    bottom: 4.5rem;
    left: 0;
    right: 0;
    z-index: 4;
    text-align: center;
    color: var(--cream);
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(0.95rem, 2.4vw, 1.35rem);
    line-height: 1.15;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  .teaser-caption span { display: block; }

  .teaser-contact {
    position: absolute;
    bottom: 4.5rem;
    right: 1.75rem;
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: center;
  }
  .teaser-contact a {
    color: var(--cream);
    opacity: 0.85;
    transition: opacity 0.15s ease;
    line-height: 0;
  }
  .teaser-contact a:hover { opacity: 1; }
  .teaser-contact svg { width: 20px; height: 20px; }

  .teaser-footer {
    position: absolute;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    z-index: 4;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
  }
  .teaser-footer a {
    color: rgba(236, 231, 221, 0.55);
    text-decoration: none;
  }
  .teaser-footer a:hover { text-decoration: underline; }

  /* El área de juego de las letras ocupa toda la pantalla, por debajo del
     resto de elementos de la interfaz. */
  .teaser-physics-stage {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .teaser-page .phys-piece {
    height: clamp(80px, 13vw, 170px);
  }
  .teaser-page .piece-reg {
    height: clamp(42px, 6.8vw, 88px);
  }

  @media (max-width: 640px) {
    .teaser-caption { bottom: 5.5rem; padding: 0 1rem; }
    .teaser-contact { bottom: 5.5rem; }
    .teaser-vertical-mark { height: clamp(90px, 16vh, 150px); right: 1rem; }
    .teaser-eyebrow { max-width: 42vw; font-size: 0.6rem; }
    .teaser-reserve-btn { padding: 0.7rem 1.2rem; font-size: 0.7rem; }
  }
</style>
</head>
<body>

<div class="teaser-page">
  <div class="teaser-eyebrow">
    <span>Restaurant &amp; Cocktails</span>
    <span>Restaurant &amp; Cocktails</span>
  </div>

  <a class="teaser-reserve-btn" href="reservar.html">Reservas</a>

  <img class="teaser-vertical-mark" src="assets/logo/roce-vertical-cream.png" alt="ROCE">

  <div class="teaser-physics-stage" id="physicsStage">
    <img class="phys-piece piece-R" src="assets/logo/pieces/letter-R-cream.png" alt="R" draggable="false">
    <img class="phys-piece piece-O" src="assets/logo/pieces/letter-O-cream.png" alt="O" draggable="false">
    <img class="phys-piece piece-C" src="assets/logo/pieces/letter-C-cream.png" alt="C" draggable="false">
    <img class="phys-piece piece-E" src="assets/logo/pieces/letter-E-cream.png" alt="E" draggable="false">
    <img class="phys-piece piece-reg" src="assets/logo/pieces/letter-reg-cream.png" alt="®" draggable="false">
  </div>

  <p class="teaser-caption">
    <span>Restaurant &amp; Cocktails</span>
    <span>Marqués del Turía 16</span>
    <span>Valencia (Spain)</span>
  </p>

  <div class="teaser-contact">
    <a href="mailto:booking@roce.es" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="1.5"/><path d="M3 6l9 7 9-7"/></svg>
    </a>
    <a href="https://www.instagram.com/somosroce" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg>
    </a>
  </div>

  <div class="teaser-footer">
    <a href="privacidad.html">Política de privacidad</a>
  </div>
</div>

<script src="script.js?v=36"></script>
</body>
</html>
