<style>
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--black);
  }

  .teaser-page {
    position: relative;
    width: 100vw;
    height: 100dvh;
    color: var(--cream);
    overflow: hidden;
    background: var(--black) url("assets/teaser/bg-restaurant.jpg") center 55% / cover no-repeat;
  }

  /* Oscurece la foto de fondo lo justo para que el texto/letras crema
     se sigan leyendo encima, sin taparla del todo. */
  .teaser-page::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.25) 35%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.7) 100%);
  }

  /* Caja de luz estilo vitrina de neón, con el logo dentro — entra
     deslizándose de izquierda a derecha al cargar la página. */
  .teaser-lightbox {
    position: absolute;
    top: 1.75rem;
    left: 1.75rem;
    z-index: 4;
    transform: translateX(-160%);
    animation: lightboxSlideIn 1.1s cubic-bezier(0.16, 0.8, 0.3, 1) 0.4s forwards;
  }
  .teaser-lightbox .lightbox-logo {
    height: clamp(90px, 15vw, 130px);
    width: auto;
    display: block;
  }
  @keyframes lightboxSlideIn {
    to { transform: translateX(0); }
  }

  .teaser-reserve-btn {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    z-index: 4;
    background: var(--cream);
    color: var(--black);
    text-decoration: none;
    font-family: var(--display);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.85rem 1.6rem;
    border-radius: 2px;
    transition: transform 0.15s ease;
  }
  .teaser-reserve-btn:hover { transform: translateY(-2px); }

  .teaser-caption {
    position: absolute;
    bottom: 4.5rem;
    left: 0;
    right: 0;
    z-index: 4;
    text-align: center;
    color: var(--cream);
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(0.95rem, 2.4vw, 1.35rem);
    line-height: 1.15;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  .teaser-caption span { display: block; }

  .teaser-contact {
    position: absolute;
    bottom: 4.5rem;
    right: 1.75rem;
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: center;
  }
  .teaser-contact a {
    color: var(--cream);
    opacity: 0.85;
    transition: opacity 0.15s ease;
    line-height: 0;
  }
  .teaser-contact a:hover { opacity: 1; }
  .teaser-contact svg { width: 20px; height: 20px; }

  .teaser-footer {
    position: absolute;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    z-index: 4;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
  }
  .teaser-footer a {
    color: rgba(236, 231, 221, 0.55);
    text-decoration: none;
  }
  .teaser-footer a:hover { text-decoration: underline; }

  /* El área de juego de las letras ocupa toda la pantalla, por debajo del
     resto de elementos de la interfaz. */
  .teaser-physics-stage {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .teaser-page .phys-piece {
    font-size: clamp(80px, 13vw, 170px);
  }
  .teaser-page .piece-reg {
    font-size: clamp(42px, 6.8vw, 88px);
  }

  @media (max-width: 640px) {
    .teaser-caption { bottom: 5.5rem; padding: 0 1rem; }
    .teaser-contact { bottom: 5.5rem; }
    .teaser-reserve-btn { padding: 0.7rem 1.2rem; font-size: 0.7rem; }
  }
</style>
</head>
<body>

<div class="teaser-page">
  <div class="teaser-lightbox">
    <img class="lightbox-logo" src="assets/logo/roce-vertical-cream.png" alt="ROCE">
  </div>

  <a class="teaser-reserve-btn" href="reservar.html">Reservas</a>

  <div class="teaser-physics-stage" id="physicsStage">
    <span class="phys-piece piece-R">R</span>
    <span class="phys-piece piece-O">O</span>
    <span class="phys-piece piece-C">C</span>
    <span class="phys-piece piece-E">E</span>
    <span class="phys-piece piece-reg">®</span>
  </div>

  <p class="teaser-caption">
    <span>Restaurant &amp; Cocktails</span>
    <span>Marqués del Turía 16</span>
    <span>Valencia (Spain)</span>
  </p>

  <div class="teaser-contact">
    <a href="mailto:booking@roce.es" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="1.5"/><path d="M3 6l9 7 9-7"/></svg>
    </a>
    <a href="https://www.instagram.com/somosroce" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg>
    </a>
  </div>

  <div class="teaser-footer">
    <a href="privacidad.html">Política de privacidad</a>
  </div>
</div>

<script src="script.js?v=39"></script>
</body>
</html>
